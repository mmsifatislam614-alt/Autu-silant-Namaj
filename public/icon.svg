<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Islamic geometric stars background pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="220" />
    <circle cx="256" cy="256" r="170" />
    <polygon points="256,56 397,197 397,397 256,476 115,397 115,197" />
    <polygon points="256,476 397,335 397,135 256,56 115,135 115,335" />
  </g>
  <!-- Mosque Dome Silhouette -->
  <path d="M 176 350 C 176 280, 220 235, 256 190 C 292 235, 336 280, 336 350 Z" fill="url(#gold)" opacity="0.95" />
  <!-- Minaret details -->
  <rect x="252" y="165" width="8" height="28" rx="4" fill="#fef08a" />
  <!-- Crescent Moon -->
  <path d="M 264 125 A 28 28 0 1 0 240 168 A 22 22 0 1 1 264 125 Z" fill="url(#gold)" filter="url(#glow)" />
  <!-- Auto Silent Phone Bell badge -->
  <g transform="translate(256, 345)">
    <circle cx="0" cy="0" r="48" fill="#0f172a" stroke="#fbbf24" stroke-width="3" />
    <!-- Bell slash / Silent Icon -->
    <path d="M -16 -12 C -16 -20, 16 -20, 16 -12 C 16 -4, 22 6, 26 12 L -26 12 C -22 6, -16 -4, -16 -12 Z" fill="#fbbf24" />
    <path d="M -6 16 C -6 20, 6 20, 6 16 Z" fill="#fbbf24" />
    <!-- Slash across bell -->
    <line x1="-22" y1="-20" x2="22" y2="20" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
